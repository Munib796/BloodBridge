<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>BloodBridge — Requestor Profile</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#fff1f2',
              100: '#ffe4e6',
              500: '#f43f5e',
              600: '#e11d48',
              700: '#c8102e',
              800: '#9f1239',
              900: '#881337',
            }
          }
        }
      }
    }
  </script>
<style>
    body {
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      background-color: #f8fafc;
    }
    .custom-shadow {
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px -1px rgba(0, 0, 0, 0.05);
    }
    .card-border {
      border: 1px solid #e2e8f0;
    }
  </style>
</head>
<body class="flex min-h-screen text-slate-900 selection:bg-rose-100 selection:text-rose-900 bg-[#faf8ff]">
<!-- Mobile Viewport Container (390px width) -->
<div class="w-full min-h-screen bg-[#faf8ff] flex flex-col relative pb-24">
<!-- Top App Bar -->
<header class="sticky top-0 z-30 bg-[#faf8ff]/95 backdrop-blur-md border-b border-slate-200/80 px-4 py-3 flex items-center justify-between">
<div class="flex items-center gap-2">
<div class="w-8 h-8 rounded-full bg-[#FFF1F2] flex items-center justify-center text-[#c8102e] shadow-sm">
<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
<path d="M12 21.5c-4.142 0-7.5-3.358-7.5-7.5 0-4.5 7.5-12 7.5-12s7.5 7.5 7.5 12c0 4.142-3.358 7.5-7.5 7.5z"></path>
</svg>
</div>
<div>
<span class="font-bold text-base text-slate-900 tracking-tight">BloodBridge</span>
<span class="block text-[10px] uppercase font-semibold text-slate-400 tracking-wider -mt-1">Requestor Portal</span>
</div>
</div>

</header>
<!-- Main Scrollable Content -->
<main class="flex-1 px-4 pt-6 pb-4 space-y-6">
<!-- Profile Header / Avatar Section -->
<div class="flex flex-col items-center justify-center pt-2 pb-1 text-center">
<!-- Avatar with Initials fallback + Edit Button -->
<div class="relative mb-3">
<div class="w-24 h-24 rounded-full bg-[#ffe4e6] text-[#c8102e] flex items-center justify-center text-2xl font-bold border-4 border-white shadow-md">
<span class="">FA</span>
</div>
<button aria-label="Edit avatar" class="absolute bottom-0 right-0 w-7 h-7 bg-[#c8102e] text-white rounded-full flex items-center justify-center shadow-md hover:bg-[#a90c24] active:scale-95 transition-all border-2 border-white" type="button">
<svg class="w-3.5 h-3.5 stroke-current" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
<path d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
<!-- Full Name -->
<h1 class="text-xl font-bold text-slate-900 tracking-tight">Fatima Ali</h1>

</div>
<!-- Section: Account Information -->
<section>
<h2 class="text-[11px] font-bold uppercase tracking-wider text-slate-400 px-1 mb-2">Account Information</h2>
<div class="bg-white rounded-2xl border card-border custom-shadow overflow-hidden divide-y divide-slate-100">
<!-- Email Row -->
<div class="p-3.5 flex items-center justify-between hover:bg-slate-50 transition-colors">
<div class="flex items-center gap-3 min-w-0 pr-2">
<div class="w-9 h-9 rounded-xl bg-slate-100 text-slate-600 flex items-center justify-center shrink-0">
<svg class="w-4 h-4 stroke-current" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
<path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<div class="min-w-0">
<p class="text-xs text-slate-400 font-medium leading-none">Email Address</p>
<p class="text-sm font-medium text-slate-800 truncate mt-1">fatima.ali@example.com</p>
</div>
</div>
<button class="shrink-0 text-xs font-semibold text-[#c8102e] hover:text-[#9f1239] flex items-center gap-0.5 pl-2 py-1">
<span class="">Edit</span>
<svg class="w-3.5 h-3.5 stroke-current" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
<!-- Phone Row -->
<div class="p-3.5 flex items-center justify-between hover:bg-slate-50 transition-colors">
<div class="flex items-center gap-3 min-w-0 pr-2">
<div class="w-9 h-9 rounded-xl bg-slate-100 text-slate-600 flex items-center justify-center shrink-0">
<svg class="w-4 h-4 stroke-current" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
<path d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<div class="min-w-0">
<p class="text-xs text-slate-400 font-medium leading-none">Phone Number</p>
<p class="text-sm font-medium text-slate-800 truncate mt-1">+92 300 9876543</p>
</div>
</div>
<button class="shrink-0 text-xs font-semibold text-[#c8102e] hover:text-[#9f1239] flex items-center gap-0.5 pl-2 py-1">
<span class="">Edit</span>
<svg class="w-3.5 h-3.5 stroke-current" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</div>
</section>
<!-- Section: Preferences & Security -->
<section>
<h2 class="text-[11px] font-bold uppercase tracking-wider text-slate-400 px-1 mb-2">Preferences &amp; Security</h2>
<div class="bg-white rounded-2xl border card-border custom-shadow overflow-hidden divide-y divide-slate-100">
<!-- Notification Preferences Row -->
<div class="p-3.5 flex items-center justify-between hover:bg-slate-50 transition-colors cursor-pointer">
<div class="flex items-center gap-3 min-w-0">
<div class="w-9 h-9 rounded-xl bg-slate-100 text-slate-600 flex items-center justify-center shrink-0">
<svg class="w-4 h-4 stroke-current" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
<path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<div class="min-w-0 pr-2">
<p class="text-sm font-semibold text-slate-800">Notification Preferences</p>
<p class="text-xs text-slate-500 truncate mt-0.5">Emergency alerts, Push notifications</p>
</div>
</div>
<svg class="w-4 h-4 text-slate-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<!-- Change Password Row (no timestamp) -->
<div class="p-3.5 flex items-center justify-between hover:bg-slate-50 transition-colors cursor-pointer">
<div class="flex items-center gap-3 min-w-0">
<div class="w-9 h-9 rounded-xl bg-slate-100 text-slate-600 flex items-center justify-center shrink-0">
<svg class="w-4 h-4 stroke-current" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
<path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<div class="min-w-0">
<p class="text-sm font-semibold text-slate-800">Change Password</p>
</div>
</div>
<svg class="w-4 h-4 text-slate-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</div>
</section>
<!-- Account Actions (Log Out & Delete Account) -->
<div class="pt-2 space-y-3">
<!-- Log Out Button (Secondary outline / light brand style matching design system) -->
<button class="w-full h-14 rounded-xl border border-[#c8102e]/30 bg-white text-[#c8102e] font-semibold text-base shadow-md flex items-center justify-center gap-2 hover:bg-rose-50/60 active:scale-95 transition-all custom-shadow" id="logout-button" type="button">
<svg class="w-5 h-5 stroke-current" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
<path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="">Log Out</span>
</button>
<!-- Delete Account (Muted de-emphasized button) -->
<div class="text-center pt-1">
<button class="text-xs font-medium text-slate-400 hover:text-rose-600 transition-colors py-1 px-3">
            Delete Account
          </button>
</div>
</div>
</main>
<!-- Persistent Mobile Bottom Tab Bar (Requests, History, Profile - Profile Active) -->
<nav class="fixed bottom-0 w-full bg-white/95 backdrop-blur-md border-t border-slate-200 z-40 px-6 py-2.5 flex items-center justify-between shadow-[0_-2px_10px_rgba(0,0,0,0.03)] right-0">
<!-- Requests Tab -->
<button class="flex flex-col items-center gap-1 group text-slate-400 hover:text-slate-600 transition-colors w-16">
<svg class="w-6 h-6 fill-none stroke-current" stroke-width="1.8" viewBox="0 0 24 24">
<path d="M12 21.5c-4.142 0-7.5-3.358-7.5-7.5 0-4.5 7.5-12 7.5-12s7.5 7.5 7.5 12c0 4.142-3.358 7.5-7.5 7.5z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[11px] font-medium leading-none tracking-tight">Requests</span>
</button>
<!-- History Tab -->
<button class="flex flex-col items-center gap-1 group text-slate-400 hover:text-slate-600 transition-colors w-16">
<svg class="w-6 h-6 fill-none stroke-current" stroke-width="1.8" viewBox="0 0 24 24">
<circle cx="12" cy="12" r="9"></circle>
<polyline points="12 7 12 12 15 15"></polyline>
</svg>
<span class="text-[11px] font-medium leading-none tracking-tight">History</span>
</button>
<!-- Profile Tab (Active: Crimson #c8102e) -->
<button class="flex flex-col items-center gap-1 text-[#c8102e] font-semibold w-16">
<svg class="w-6 h-6 fill-none stroke-current" stroke-width="2" viewBox="0 0 24 24">
<path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[11px] leading-none tracking-tight">Profile</span>
</button>
</nav>
</div>





</body></html>
