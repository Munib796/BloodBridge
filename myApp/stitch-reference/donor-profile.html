<script>
  (function() {
    // Availability Toggle Interaction
    const toggleBtn = document.getElementById('availability-toggle');
    const toggleThumb = document.getElementById('toggle-thumb');
    const beaconDot = document.getElementById('beacon-dot');
    const beaconSolid = document.getElementById('beacon-solid');
    const subtext = document.getElementById('availability-subtext');

    if (toggleBtn && toggleThumb) {
      let isAvailable = true;

      toggleBtn.addEventListener('click', function() {
        isAvailable = !isAvailable;
        toggleBtn.setAttribute('aria-checked', isAvailable.toString());

        if (isAvailable) {
          toggleBtn.classList.remove('bg-surface-variant');
          toggleBtn.classList.add('bg-secondary');
          toggleThumb.classList.remove('translate-x-1');
          toggleThumb.classList.add('translate-x-6');
          if (beaconDot) beaconDot.classList.remove('hidden');
          if (beaconSolid) beaconSolid.classList.remove('bg-outline');
          if (beaconSolid) beaconSolid.classList.add('bg-secondary');
          if (subtext) subtext.textContent = "Turn off if you're temporarily unable to donate";
        } else {
          toggleBtn.classList.remove('bg-secondary');
          toggleBtn.classList.add('bg-surface-variant');
          toggleThumb.classList.remove('translate-x-6');
          toggleThumb.classList.add('translate-x-1');
          if (beaconDot) beaconDot.classList.add('hidden');
          if (beaconSolid) beaconSolid.classList.remove('bg-secondary');
          if (beaconSolid) beaconSolid.classList.add('bg-outline');
          if (subtext) subtext.textContent = "You will not receive urgent dispatch alerts";
        }
      });
    }

    // Active bottom navigation styling sync with shell
    const profileNavTab = document.querySelector('nav a[data-path="profile"]');
    if (profileNavTab) {
      profileNavTab.classList.remove('text-on-surface-variant');
      profileNavTab.classList.add('text-primary-container', 'font-semibold');
      const icon = profileNavTab.querySelector('.material-symbols-outlined');
      if (icon) {
        icon.style.fontVariationSettings = "'FILL' 1";
      }
    }
  })();
