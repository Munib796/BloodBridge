<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>BloodBridge — Donor Sign Up</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #FAFAFB;
      color: #0F172A;
      -webkit-tap-highlight-color: transparent;
    }
    .custom-shadow {
      box-shadow: 0 10px 25px -4px rgba(200, 16, 46, 0.28), 0 4px 10px -2px rgba(200, 16, 46, 0.15);
    }
    .soft-border {
      border: 1px solid #E2E8F0;
    }
    .soft-border:focus-within {
      border-color: #C8102E;
      box-shadow: 0 0 0 3px rgba(200, 16, 46, 0.12);
    }
    /* Hide scrollbar for clean mobile presentation */
    ::-webkit-scrollbar {
      display: none;
    }
    * {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="min-h-screen bg-[#FAFAFB] text-[#0F172A] antialiased">
<div class="w-full min-h-screen bg-[#FAFAFB] px-6 pt-5 pb-8 flex flex-col">
<!-- Top Bar & Header Section -->
<div>
<!-- Navigation Header -->
<div class="relative flex items-center justify-between mb-6">
<button aria-label="Go Back" class="w-10 h-10 rounded-full bg-white soft-border flex items-center justify-center text-slate-700 shadow-sm active:scale-95 transition-transform" type="button">
<svg class="w-5 h-5 stroke-[2.2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Centered Droplet Mark -->
<div class="w-12 h-12 rounded-2xl bg-[#FFF1F2] flex items-center justify-center shadow-sm"><svg class="w-7 h-7" fill="none" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><path d="M16 3C16 3 7 13.5 7 19.5C7 24.7467 11.0294 29 16 29C20.9706 29 25 24.7467 25 19.5C25 13.5 16 3 16 3Z" fill="#C8102E"></path><path d="M10.5 19.5H13L14.5 16L17.5 23L19 19.5H21.5" stroke="white" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path></svg></div>
<div class="w-10"></div> <!-- Placeholder balance for true centering -->
</div>
<!-- Headline & Subtext -->
<div class="mb-6">
<h1 class="text-[28px] font-bold tracking-tight text-[#0F172A] leading-tight mb-2">
          Become a Lifesaver
        </h1>
<p class="text-[14px] leading-relaxed text-[#64748B]">
          Your blood type could be exactly what someone needs.
        </p>
</div>
<!-- Form Inputs Container -->
<form class="space-y-4" onsubmit="event.preventDefault();">
<!-- Full Name Field -->
<div>
<label class="block text-[13px] font-semibold text-[#0F172A] mb-1.5" for="fullName">
            Full Name
          </label>
<div class="relative rounded-xl bg-white soft-border transition-all">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<input class="w-full h-12 pl-10 pr-3.5 bg-transparent rounded-xl text-[14px] text-[#0F172A] placeholder:text-slate-400 focus:outline-none" id="fullName" placeholder="Ahmed Ali" type="text">
</div>
</div>
<!-- Email Field -->
<div>
<label class="block text-[13px] font-semibold text-[#0F172A] mb-1.5" for="email">
            Email
          </label>
<div class="relative rounded-xl bg-white soft-border transition-all">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<input class="w-full h-12 pl-10 pr-3.5 bg-transparent rounded-xl text-[14px] text-[#0F172A] placeholder:text-slate-400 focus:outline-none" id="email" placeholder="name@example.com" type="email">
</div>
</div>
<!-- Phone Number Field with Country Selector -->
<div>
<label class="block text-[13px] font-semibold text-[#0F172A] mb-1.5" for="phone">
            Phone Number
          </label>
<div class="flex gap-2">
<!-- Country Code Prefix Selector -->
<div class="w-[100px] flex-shrink-0 bg-white soft-border rounded-xl flex items-center justify-center h-12 text-[14px] font-semibold text-[#0F172A] gap-2 select-none"><span class="">🇵🇰</span><span class="">+92</span></div>
<!-- Phone Digits Input -->
<div class="relative flex-1 bg-white soft-border rounded-xl">
<input class="w-full h-12 px-3.5 bg-transparent rounded-xl text-[14px] text-[#0F172A] placeholder:text-slate-400 focus:outline-none" id="phone" placeholder="300 1234567" type="tel">
</div>
</div>
</div>
<!-- Blood Type 8-Pill Grid -->
<div class="pt-1">
<div class="flex items-center justify-between mb-2">
<label class="block text-[13px] font-semibold text-[#0F172A]">
              Blood Type
            </label>
<span class="text-[12px] text-slate-400 font-normal">Select one</span>
</div>
<!-- 8 Equal Selection Chips: O+, O-, A+, A-, B+, B-, AB+, AB- -->
<div class="grid grid-cols-4 gap-2" id="bloodTypeContainer">
<button class="blood-btn h-11 rounded-xl bg-white soft-border text-[15px] font-semibold text-[#0F172A] flex items-center justify-center transition-all hover:bg-slate-50 active:scale-95" onclick="selectBloodType(this)" type="button">
              O+
            </button>
<button class="blood-btn h-11 rounded-xl bg-white soft-border text-[15px] font-semibold text-[#0F172A] flex items-center justify-center transition-all hover:bg-slate-50 active:scale-95" onclick="selectBloodType(this)" type="button">
              O-
            </button>
<button class="blood-btn h-11 rounded-xl bg-white soft-border text-[15px] font-semibold text-[#0F172A] flex items-center justify-center transition-all hover:bg-slate-50 active:scale-95" onclick="selectBloodType(this)" type="button">
              A+
            </button>
<button class="blood-btn h-11 rounded-xl bg-white soft-border text-[15px] font-semibold text-[#0F172A] flex items-center justify-center transition-all hover:bg-slate-50 active:scale-95" onclick="selectBloodType(this)" type="button">
              A-
            </button>
<button class="blood-btn h-11 rounded-xl bg-white soft-border text-[15px] font-semibold text-[#0F172A] flex items-center justify-center transition-all hover:bg-slate-50 active:scale-95" onclick="selectBloodType(this)" type="button">
              B+
            </button>
<button class="blood-btn h-11 rounded-xl bg-white soft-border text-[15px] font-semibold text-[#0F172A] flex items-center justify-center transition-all hover:bg-slate-50 active:scale-95" onclick="selectBloodType(this)" type="button">
              B-
            </button>
<button class="blood-btn h-11 rounded-xl bg-white soft-border text-[15px] font-semibold text-[#0F172A] flex items-center justify-center transition-all hover:bg-slate-50 active:scale-95" onclick="selectBloodType(this)" type="button">
              AB+
            </button>
<button class="blood-btn h-11 rounded-xl bg-white soft-border text-[15px] font-semibold text-[#0F172A] flex items-center justify-center transition-all hover:bg-slate-50 active:scale-95" onclick="selectBloodType(this)" type="button">
              AB-
            </button>
</div>
</div>
<!-- Password Field with Show/Hide & Strength Bar -->
<div class="pt-1">
<label class="block text-[13px] font-semibold text-[#0F172A] mb-1.5" for="password">
            Password
          </label>
<div class="relative rounded-xl bg-white soft-border transition-all">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<input class="w-full h-12 pl-10 pr-11 bg-transparent rounded-xl text-[14px] text-[#0F172A] placeholder:text-slate-400 focus:outline-none" id="password" oninput="updateStrength(this.value)" placeholder="Create a strong password" type="password">
<button aria-label="Toggle password visibility" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none" onclick="togglePasswordVisibility()" type="button">
<svg class="w-4 h-4" fill="none" id="eyeIcon" stroke="currentColor" viewBox="0 0 24 24">
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
<path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
</div>
<!-- Password Strength Indicator Bar -->
<div class="mt-2.5">
<div class="w-full h-1.5 bg-slate-200 rounded-full overflow-hidden flex">
<div class="h-full w-1/4 bg-transparent border-r border-white/60 transition-all duration-300" id="strengthSegment1"></div>
<div class="h-full w-1/4 bg-transparent border-r border-white/60 transition-all duration-300" id="strengthSegment2"></div>
<div class="h-full w-1/4 bg-transparent border-r border-white/60 transition-all duration-300" id="strengthSegment3"></div>
<div class="h-full w-1/4 bg-transparent transition-all duration-300" id="strengthSegment4"></div>
</div>
<div class="flex justify-between items-center mt-1.5">
<span class="text-[11px] text-slate-400 font-medium" id="strengthText">Password strength</span>
<span class="text-[11px] text-slate-400">At least 8 characters</span>
</div>
</div>
</div>
</form>
</div>
<!-- Bottom Actions: Primary Button & Legal Terms -->
<div class="mt-6">
<button class="w-full h-14 bg-[#C8102E] hover:bg-[#B30D28] active:scale-[0.99] text-white font-semibold text-[16px] rounded-2xl custom-shadow transition-all duration-150 flex items-center justify-center tracking-wide" type="button">
        Create Donor Account
      </button>
<!-- Centered Legal Text with Crimson Links -->
<p class="text-center text-[12px] leading-relaxed text-[#64748B] mt-4 px-2">
        By signing up you agree to our 
        <a class="text-[#C8102E] font-medium hover:underline" href="#">Terms</a> 
        &amp; 
        <a class="text-[#C8102E] font-medium hover:underline" href="#">Privacy Policy</a>
</p>
</div>
</div>
<script>
    // Blood type pill single selection
    function selectBloodType(button) {
      const allButtons = document.querySelectorAll('.blood-btn');
      allButtons.forEach(btn => {
        btn.classList.remove('bg-[#C8102E]', 'text-white', 'border-[#C8102E]', 'shadow-sm');
        btn.classList.add('bg-white', 'soft-border', 'text-[#0F172A]');
      });
      button.classList.remove('bg-white', 'soft-border', 'text-[#0F172A]');
      button.classList.add('bg-[#C8102E]', 'text-white', 'border-[#C8102E]', 'shadow-sm');
    }

    // Toggle password visibility
    function togglePasswordVisibility() {
      const pwdInput = document.getElementById('password');
      const isPassword = pwdInput.type === 'password';
      pwdInput.type = isPassword ? 'text' : 'password';
    }

    // Password strength meter simulation
    function updateStrength(value) {
      const s1 = document.getElementById('strengthSegment1');
      const s2 = document.getElementById('strengthSegment2');
      const s3 = document.getElementById('strengthSegment3');
      const s4 = document.getElementById('strengthSegment4');
      const text = document.getElementById('strengthText');

      // Reset
      [s1, s2, s3, s4].forEach(s => s.className = 'h-full w-1/4 bg-transparent border-r border-white/60 transition-all duration-300');
      s4.className = 'h-full w-1/4 bg-transparent transition-all duration-300';

      if (!value || value.length === 0) {
        text.textContent = 'Password strength';
        text.className = 'text-[11px] text-slate-400 font-medium';
        return;
      }

      let score = 0;
      if (value.length >= 6) score++;
      if (value.length >= 8 && /[A-Z]/.test(value)) score++;
      if (value.length >= 10 && /[0-9]/.test(value)) score++;
      if (/[^A-Za-z0-9]/.test(value)) score++;

      if (score === 1) {
        s1.classList.remove('bg-transparent');
        s1.classList.add('bg-rose-500');
        text.textContent = 'Weak';
        text.className = 'text-[11px] text-rose-500 font-medium';
      } else if (score === 2) {
        s1.classList.remove('bg-transparent');
        s1.classList.add('bg-amber-500');
        s2.classList.remove('bg-transparent');
        s2.classList.add('bg-amber-500');
        text.textContent = 'Fair';
        text.className = 'text-[11px] text-amber-500 font-medium';
      } else if (score === 3) {
        s1.classList.remove('bg-transparent');
        s1.classList.add('bg-emerald-500');
        s2.classList.remove('bg-transparent');
        s2.classList.add('bg-emerald-500');
        s3.classList.remove('bg-transparent');
        s3.classList.add('bg-emerald-500');
        text.textContent = 'Good';
        text.className = 'text-[11px] text-emerald-600 font-medium';
      } else if (score >= 4) {
        s1.classList.remove('bg-transparent');
        s1.classList.add('bg-emerald-600');
        s2.classList.remove('bg-transparent');
        s2.classList.add('bg-emerald-600');
        s3.classList.remove('bg-transparent');
        s3.classList.add('bg-emerald-600');
        s4.classList.remove('bg-transparent');
        s4.classList.add('bg-emerald-600');
        text.textContent = 'Strong';
        text.className = 'text-[11px] text-emerald-600 font-medium';
      }
    }
  </script>








</body></html>
