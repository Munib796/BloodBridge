<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>BloodBridge — Requestor Sign Up</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              crimson: '#C8102E',
              crimsonHover: '#A60D26',
              lightPink: '#FFF1F2',
              slateDark: '#0F172A',
              slateMuted: '#64748B',
              borderLight: '#E2E8F0',
            }
          }
        }
      }
    }
  </script>
<style>
    body {
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    input:focus {
      outline: none;
    }
  </style>
</head>
<body class="bg-[#FAF8FF] text-brand-slateDark min-h-screen antialiased selection:bg-brand-crimson/10 selection:text-brand-crimson">
<div class="w-full px-6 pt-6 pb-8 flex flex-col">
<!-- Top Bar Navigation & Brand Mark -->
<div>
<div class="flex items-center justify-between relative mb-8">
<button aria-label="Go back" class="w-11 h-11 rounded-full bg-white border border-[#E2E8F0] shadow-sm flex items-center justify-center text-slate-700 hover:bg-slate-50 transition-colors active:scale-95" type="button">
<svg class="w-5 h-5 text-slate-700" fill="none" stroke="currentColor" stroke-width="2.2" viewbox="0 0 24 24">
<path d="M15.75 19.5L8.25 12l7.5-7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Brand Droplet + Pulse Logo (Exact from Donor/Login/Welcome) -->
<div class="absolute left-1/2 -translate-x-1/2 flex items-center justify-center">
<div class="w-12 h-12 rounded-2xl bg-[#FFF1F2] border border-[#FFE4E6] flex items-center justify-center shadow-sm">
<svg class="w-7 h-7" fill="none" viewbox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
<path d="M16 3C16 3 7 13.5 7 19.5C7 24.7467 11.0294 29 16 29C20.9706 29 25 24.7467 25 19.5C25 13.5 16 3 16 3Z" fill="#C8102E"></path>
<path d="M10.5 19.5H13L14.5 16L17.5 23L19 19.5H21.5" stroke="white" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
</div>
</div>
<div aria-hidden="true" class="w-11 h-11 opacity-0 pointer-events-none"></div>
</div>
<!-- Header Section -->
<div class="mb-6">
<h1 class="text-[28px] font-bold tracking-tight text-slate-900 leading-tight">Get Help Fast</h1>
<p class="mt-2 text-[15px] leading-relaxed text-[#64748B] font-normal">
          Reach verified nearby donors in seconds during an emergency.
        </p>
</div>
<!-- Form Elements -->
<form class="space-y-4" onsubmit="event.preventDefault();">
<!-- Full Name -->
<div>
<label class="block text-[14px] font-semibold text-slate-900 mb-1.5">Full Name</label>
<div class="relative flex items-center">
<span class="absolute left-4 text-slate-400">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</span>
<input class="w-full bg-white border border-[#E2E8F0] rounded-2xl py-3.5 pl-12 pr-4 text-[15px] text-slate-900 placeholder-slate-400 shadow-sm focus:border-[#C8102E] focus:ring-1 focus:ring-[#C8102E] transition-all" placeholder="Ahmed Ali" type="text"/>
</div>
</div>
<!-- Email -->
<div>
<label class="block text-[14px] font-semibold text-slate-900 mb-1.5">Email</label>
<div class="relative flex items-center">
<span class="absolute left-4 text-slate-400">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</span>
<input class="w-full bg-white border border-[#E2E8F0] rounded-2xl py-3.5 pl-12 pr-4 text-[15px] text-slate-900 placeholder-slate-400 shadow-sm focus:border-[#C8102E] focus:ring-1 focus:ring-[#C8102E] transition-all" placeholder="name@example.com" type="email"/>
</div>
</div>
<!-- Phone Number (Pakistan default prefix badge) -->
<div>
<label class="block text-[14px] font-semibold text-slate-900 mb-1.5">Phone Number</label>
<div class="flex gap-2.5">
<div class="flex items-center gap-1.5 px-3.5 py-3.5 bg-white border border-[#E2E8F0] rounded-2xl shadow-sm text-[15px] font-medium text-slate-900 shrink-0">
<span class="text-xs font-semibold text-slate-500">PK</span>
<span class="text-sm font-semibold text-slate-900">+92</span>
</div>
<div class="relative flex-1">
<input class="w-full bg-white border border-[#E2E8F0] rounded-2xl py-3.5 px-4 text-[15px] text-slate-900 placeholder-slate-400 shadow-sm focus:border-[#C8102E] focus:ring-1 focus:ring-[#C8102E] transition-all" placeholder="300 1234567" type="tel"/>
</div>
</div>
</div>
<!-- Password -->
<div>
<label class="block text-[14px] font-semibold text-slate-900 mb-1.5">Password</label>
<div class="relative flex items-center">
<span class="absolute left-4 text-slate-400">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</span>
<input class="w-full bg-white border border-[#E2E8F0] rounded-2xl py-3.5 pl-12 pr-12 text-[15px] text-slate-900 placeholder-slate-400 shadow-sm focus:border-[#C8102E] focus:ring-1 focus:ring-[#C8102E] transition-all" id="password-input" placeholder="Create a strong password" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-4 text-slate-400 hover:text-slate-600 focus:outline-none transition-colors" id="toggle-password" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
<!-- Password Strength Indicator -->
<div class="mt-2.5">
<div class="grid grid-cols-4 gap-1.5 h-1.5">
<div class="h-full rounded-full bg-slate-200"></div>
<div class="h-full rounded-full bg-slate-200"></div>
<div class="h-full rounded-full bg-slate-200"></div>
<div class="h-full rounded-full bg-slate-200"></div>
</div>
<div class="flex justify-between items-center mt-1.5 text-xs text-slate-400">
<span>Password strength</span>
<span>At least 8 characters</span>
</div>
</div>
</div>
<!-- Primary Action Button (Right below password with normal spacing, no empty dead gap) -->
<div class="pt-2">
<button class="w-full h-14 bg-[#C8102E] hover:bg-[#B00E28] active:scale-[0.99] text-white font-semibold text-[16px] rounded-2xl shadow-lg shadow-[#C8102E]/25 transition-all flex items-center justify-center cursor-pointer" type="submit">
            Create Requestor Account
          </button>
</div>
<!-- Centered Legal Text with Tappable Crimson Terms & Privacy Policy Links -->
<p class="text-center text-[13px] text-slate-500 pt-1 leading-relaxed">
          By signing up you agree to our 
          <a class="text-[#C8102E] font-medium hover:underline" href="#">Terms</a> &amp; 
          <a class="text-[#C8102E] font-medium hover:underline" href="#">Privacy Policy</a>
</p>
</form>
</div>
</div>
<script>
    const toggleBtn = document.getElementById('toggle-password');
    const pwdInput = document.getElementById('password-input');
    if (toggleBtn && pwdInput) {
      toggleBtn.addEventListener('click', () => {
        const isPassword = pwdInput.type === 'password';
        pwdInput.type = isPassword ? 'text' : 'password';
      });
    }
  </script>
</body>
</html>
